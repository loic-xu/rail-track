name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with Ruff
        run: uv run ruff check src/ tests/ dags/

      - name: Check Formatting with Ruff
        run: uv run ruff format --check src/ tests/ dags/

      - name: Strict Typecheck with Mypy
        run: uv run mypy src/ tests/

      - name: Run Pytest Test Suite (26 tests)
        run: uv run pytest --verbose

      - name: Validate dbt Models Compilation
        run: uv run dbt compile --profiles-dir dbt --project-dir dbt
