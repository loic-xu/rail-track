[project]
name = "rail-track"
version = "0.1.0"
description = "Real-time transit lakehouse tracking punctuality on Paris RER A & B with DuckDB, dbt, and Airflow"
readme = "README.md"
authors = [
    { name = "loic-xu", email = "loic.xu@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
