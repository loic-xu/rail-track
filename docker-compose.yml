# ==============================================================================
# RailTrack — Apache Airflow & Postgres Multi-Service Orchestration Stack
# Lead Data Engineer Standard: Modular, Idempotent, and Health-Checked Setup
# ==============================================================================

# ==============================================================================
# Shared Airflow Configuration Block (YAML Anchor)
# Reused across init, webserver, and scheduler to maintain DRY principles
# ==============================================================================
x-airflow-common: &airflow-common
  image: rail-track-airflow:latest
  build:
    context: .
    dockerfile: Dockerfile
  user: "${AIRFLOW_UID:-1000}:0"
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  env_file:
    - .env
  environment:
    # Core Executor Configuration (LocalExecutor for lightweight single-node runtime)
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    # Security & Cryptography Keys (loaded from .env)
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}

    # Operational Hygiene: Disable sample DAGs and unpause newly discovered pipelines
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    # Python Module Search Path & dbt Project Integration
    PYTHONPATH: /opt/airflow/src
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_DUCKDB_PATH: /opt/airflow/data/gold/rail_track.duckdb
    DBT_SILVER_PATH: /opt/airflow/data/silver/year=*/month=*/*.parquet

  volumes:
    # Pipeline code & DAG definitions
    - ./dags:/opt/airflow/dags
    # Data Lakehouse volumes (Bronze, Silver, Gold persistence)
    - ./data:/opt/airflow/data
    # Reusable Python source package (read-only for security)
    - ./src:/opt/airflow/src:ro
    # Transformation engine: dbt project models, macros, seeds
    - ./dbt:/opt/airflow/dbt
    # Execution logs
    - ./logs:/opt/airflow/logs

  depends_on:
    postgres:
      condition: service_healthy

services:
  # ============================================================================
  # Service 1: PostgreSQL Metadata Database
  # Stores Airflow state, DAG run records, and task status
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: rail-track-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ============================================================================
  # Service 2: Airflow Database Initializer
  # Triggers database schema migrations and provisions the Admin account
  # ============================================================================
  airflow-init:
    <<: *airflow-common
    container_name: rail-track-airflow-init
    command: version
    environment:
      # Inherit common env while adding official init hooks
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/src
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@railtrack.internal
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: LeadDE
    restart: "no"

  # ============================================================================
  # Service 3: Airflow Webserver (UI & REST API)
  # Exposes the management dashboard on http://localhost:8080
  # ============================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: rail-track-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # ============================================================================
  # Service 4: Airflow Scheduler
  # Monitors DAGs, schedules execution intervals, and triggers tasks
  # ============================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: rail-track-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres-db-volume:
